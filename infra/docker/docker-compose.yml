services:
  epsca-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - epsca-db-data:/var/lib/postgresql/data
    networks:
      - dokploy-network
    restart: unless-stopped

  epsca-qdrant:
    image: qdrant/qdrant:latest
    environment:
      # NOTE — INERT under Dokploy (documentation only). Dokploy injects each
      # service's Environment-tab vars into the container VERBATIM and does NOT
      # apply this compose `environment:` remapping (confirmed live 2026-07-26).
      # Qdrant only reads QDRANT__SERVICE__* vars, so those exact names are set
      # DIRECTLY on the epsca-qdrant Dokploy Environment tab — editing the two
      # lines below changes nothing in prod; they are kept only as a record of the
      # var names Qdrant expects. Least-privilege key split (#144/#155):
      #   QDRANT__SERVICE__API_KEY (read-write): host ingestion + backups.
      #   QDRANT__SERVICE__READ_ONLY_API_KEY (read-only): the API query path.
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
      QDRANT__SERVICE__READ_ONLY_API_KEY: ${QDRANT_READ_ONLY_API_KEY}
    volumes:
      - epsca-qdrant-data:/qdrant/storage
    networks:
      - dokploy-network
    restart: unless-stopped

  epsca-api:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/epscaxplor-api:${GIT_SHA:-latest}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      QDRANT_URL: ${QDRANT_URL}
      # Least-privilege: the API reads Qdrant with the READ-ONLY key only, never
      # the write-capable QDRANT_API_KEY, so a compromised API cannot rewrite the
      # collection (#155).
      QDRANT_READ_ONLY_API_KEY: ${QDRANT_READ_ONLY_API_KEY}
      OLLAMA_URL: ${OLLAMA_URL}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_HAIKU_MODEL: ${CLAUDE_HAIKU_MODEL}
      CLAUDE_SONNET_MODEL: ${CLAUDE_SONNET_MODEL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRY_SECONDS: ${JWT_ACCESS_EXPIRY_SECONDS}
      JWT_REFRESH_EXPIRY_DAYS: ${JWT_REFRESH_EXPIRY_DAYS}
      ENVIRONMENT: ${ENVIRONMENT}
      CORS_ORIGINS: ${CORS_ORIGINS}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL}
      # Stripe billing (#32). All optional: unset means the billing routes return
      # 503 and the webhook rejects every delivery — billing off, not open.
      # STRIPE_AUTOMATIC_TAX_ENABLED stays false until GST/HST registration (#181).
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_INDIVIDUAL: ${STRIPE_PRICE_INDIVIDUAL}
      STRIPE_PRICE_PROFESSIONAL: ${STRIPE_PRICE_PROFESSIONAL}
      STRIPE_AUTOMATIC_TAX_ENABLED: ${STRIPE_AUTOMATIC_TAX_ENABLED}
    depends_on:
      - epsca-db
      - epsca-qdrant
    networks:
      - dokploy-network
    extra_hosts:
      - "host-gateway:host-gateway"
    # Routing, TLS, and middlewares for this service are managed by Dokploy's
    # Domains UI + its generated dynamic config, NOT compose traefik.* labels
    # (Dokploy/Swarm ignores them). HTTP security headers are delivered by the
    # `epsca-secheaders` middleware in /etc/dokploy/traefik/dynamic/middlewares.yml,
    # attached to the api.epscaxplor.com websecure router (#159, supersedes the
    # dead #146 labels). See docs/runbooks/traefik-security-headers.md.
    restart: unless-stopped

  epsca-web:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/epscaxplor-web:${GIT_SHA:-latest}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - epsca-api
    networks:
      - dokploy-network
    # Routing, TLS, and middlewares for this service are managed by Dokploy's
    # Domains UI + its generated dynamic config, NOT compose traefik.* labels
    # (Dokploy/Swarm ignores them). HTTP security headers are delivered by the
    # `epsca-secheaders` middleware in /etc/dokploy/traefik/dynamic/middlewares.yml,
    # attached to the epscaxplor.com + www.epscaxplor.com websecure routers (#159,
    # supersedes the dead #146 labels). See docs/runbooks/traefik-security-headers.md.
    restart: unless-stopped

volumes:
  epsca-db-data:
  epsca-qdrant-data:

networks:
  dokploy-network:
    external: true
